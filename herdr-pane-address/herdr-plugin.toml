id = "local.pane-address"
name = "Pane address"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Append each pane address to its label"
platforms = ["windows"]

[[startup]]
command = ["pwsh", "-NoProfile", "-File", "stamp.ps1"]

[[actions]]
id = "stamp"
title = "Stamp pane addresses"
contexts = ["workspace"]
command = ["pwsh", "-NoProfile", "-File", "stamp.ps1"]

[[events]]
on = "pane.created"
command = ["pwsh", "-NoProfile", "-File", "stamp.ps1"]

[[events]]
on = "pane.moved"
command = ["pwsh", "-NoProfile", "-File", "stamp.ps1"]

[[events]]
on = "pane.focused"
command = ["pwsh", "-NoProfile", "-File", "stamp.ps1"]
