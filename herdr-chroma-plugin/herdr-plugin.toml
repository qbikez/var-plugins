id = "qbikez.chroma"
name = "Chroma"
version = "0.1.0"
description = "Shows herdr agent states (blocked / working / done / idle) on a Razer Ornata V3 TKL or Royal Kludge keyboard"
min_herdr_version = "0.9.3"
platforms = ["windows"]

# Requires Bun (https://bun.sh) on PATH; this also fails the install early if it is missing.
[[build]]
command = ["bun", "install", "--frozen-lockfile"]

# Starts the daemon in the background when herdr starts. Startup hooks are one-shot, so src/start.ts detaches the
# daemon (logging to daemon.log in the plugin state dir) and exits; the daemon stops when herdr closes its event pipe.
# Set "autostart": false in config.json to skip it.
[[startup]]
command = ["bun", "src/start.ts"]

# The daemon in a pane, to watch it live. It replaces the background daemon (and vice versa).
[[panes]]
id = "daemon"
title = "Chroma keyboard"
placement = "tab"
command = ["bun", "src/main.ts"]

# Which half of the keyboard this machine owns (see README). Takes effect when the daemon restarts (restart action).
[[actions]]
id = "machine-1"
title = "Chroma: this is machine 1 (zones 0-3)"
contexts = ["workspace", "tab", "pane", "global"]
command = ["bun", "src/configure.ts", "set", "machine", "1"]

[[actions]]
id = "machine-2"
title = "Chroma: this is machine 2 (zones 4-7)"
contexts = ["workspace", "tab", "pane", "global"]
command = ["bun", "src/configure.ts", "set", "machine", "2"]

[[actions]]
id = "open"
title = "Open Chroma keyboard daemon"
contexts = ["workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "qbikez.chroma", "--entrypoint", "daemon"]

[[actions]]
id = "restart"
title = "Chroma: restart the keyboard daemon in the background"
contexts = ["workspace", "tab", "pane", "global"]
command = ["bun", "src/start.ts"]

[[actions]]
id = "log"
title = "Chroma: show the background daemon's log"
contexts = ["workspace", "tab", "pane", "global"]
command = ["bun", "src/log.ts"]

[[actions]]
id = "help"
title = "Chroma: show plugin help"
contexts = ["workspace", "tab", "pane", "global"]
command = ["bun", "src/help.ts"]
